[project]
name = "adaptive-diagnostic-engine"
version = "2.0.0"
description = "Computerized adaptive GRE diagnostic built on a 2PL item response model."
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "PT018"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
module = ["groq", "groq.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["simulation: Monte Carlo checks of the adaptive algorithm (slower)"]
filterwarnings = ["error::DeprecationWarning:app.*"]
